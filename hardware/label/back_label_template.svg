<svg xmlns="http://www.w3.org/2000/svg" width="65mm" height="145mm" viewBox="0 0 650 1450">
  <!-- Back-of-device label for Mega Blastoise. 10 SVG units = 1 mm. -->
  <style>
    @font-face {
      font-family: 'Luckiest Guy';
      src: url(data:font/ttf;base64,@@LUCKIEST_B64@@) format('truetype');
      font-weight: 400;
    }
    @font-face {
      font-family: 'Baloo 2';
      src: url(data:font/ttf;base64,@@BALOO_B64@@) format('truetype');
      font-weight: 400 800;
    }
    .h  { font-family: 'Luckiest Guy', 'DejaVu Sans', sans-serif; }
    .b  { font-family: 'Baloo 2', 'DejaVu Sans', sans-serif; font-weight: 600; }
    .bb { font-family: 'Baloo 2', 'DejaVu Sans', sans-serif; font-weight: 800; }
    .mono { font-family: 'DejaVu Sans Mono', monospace; font-weight: bold; fill: #86E7FF; }
    .outline { paint-order: stroke; stroke-linejoin: round; stroke-linecap: round; }
  </style>

  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#C4E9FF"/>
      <stop offset="0.5" stop-color="#A5DBF9"/>
      <stop offset="1" stop-color="#8CCdf2"/>
    </linearGradient>
    <linearGradient id="panelfade" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#FFFEF8"/>
      <stop offset="1" stop-color="#FDF6E3"/>
    </linearGradient>

    <!-- reusable pokeball, radius 20, centered on 0,0 -->
    <g id="pokeball">
      <circle r="20" fill="#FFFFFF" stroke="#1D3557" stroke-width="4"/>
      <path d="M -20 0 A 20 20 0 0 1 20 0 Z" fill="#EE3E34"/>
      <line x1="-20" y1="0" x2="20" y2="0" stroke="#1D3557" stroke-width="4"/>
      <circle r="6.5" fill="#FFFFFF" stroke="#1D3557" stroke-width="4"/>
    </g>

    <!-- red arcade button, radius 15, centered on 0,0 -->
    <g id="redbtn">
      <circle r="15" fill="#EE3E34" stroke="#1D3557" stroke-width="4"/>
      <ellipse cx="-4.5" cy="-5.5" rx="5.5" ry="3.5" fill="#FFFFFF" opacity="0.75"/>
    </g>

    <!-- water drop, ~22 tall, tip at 0,-11 -->
    <g id="drop">
      <path d="M 0 -11 C 5.5 -3 9 1.5 9 5.5 A 9 9 0 0 1 -9 5.5 C -9 1.5 -5.5 -3 0 -11 Z"
            fill="#5BC5F2" stroke="#1D3557" stroke-width="3.5"/>
      <circle cx="-3" cy="4" r="2.2" fill="#FFFFFF" opacity="0.85"/>
    </g>

    <!-- four-point sparkle, ~26 across -->
    <g id="spark">
      <path d="M 0 -13 L 3 -3 L 13 0 L 3 3 L 0 13 L -3 3 L -13 0 L -3 -3 Z"
            fill="#FFD23F" stroke="#1D3557" stroke-width="3"/>
    </g>
  </defs>

  <!-- ================= background ================= -->
  <rect x="0" y="0" width="650" height="1450" fill="url(#sky)"/>
  <g fill="#FFFFFF" opacity="0.16">
    <circle cx="70" cy="250" r="20"/>
    <circle cx="605" cy="330" r="14"/>
    <circle cx="40" cy="670" r="16"/>
    <circle cx="618" cy="700" r="11"/>
    <circle cx="612" cy="1075" r="17"/>
    <circle cx="38" cy="1100" r="11"/>
    <circle cx="600" cy="1420" r="14"/>
    <circle cx="55" cy="1415" r="18"/>
  </g>
  <!-- sticker frame -->
  <rect x="8" y="8" width="634" height="1434" rx="26" fill="none" stroke="#1D3557" stroke-width="6"/>

  <!-- ================= header ================= -->
  <g transform="rotate(-2.5 230 120)">
    <text class="h outline" x="34" y="90" font-size="44" letter-spacing="2"
          fill="#FFD23F" stroke="#1D3557" stroke-width="9">MEGA</text>
    <text class="h outline" x="30" y="166" font-size="65" letter-spacing="3"
          fill="#1D3557" stroke="#1D3557" stroke-width="11" transform="translate(4 5)">BLASTOISE</text>
    <text class="h outline" x="30" y="166" font-size="65" letter-spacing="3"
          fill="#FFFFFF" stroke="#1D3557" stroke-width="11">BLASTOISE</text>
  </g>
  <use href="#spark" transform="translate(390 52) scale(0.9)"/>

  <rect x="28" y="196" width="396" height="40" rx="20" fill="#1D3557"/>
  <text class="bb" x="226" y="223" font-size="20" text-anchor="middle" fill="#FFFFFF">GEN 1 BATTLES &#8226; 2 PLAYERS &#8226; 3 VS 3</text>

  <!-- ============ chibi blastoise mascot ============ -->
  <g transform="translate(443 32)" stroke-linejoin="round" stroke-linecap="round">
    <!-- cannons -->
    <g transform="translate(55 95) rotate(-25)">
      <rect x="-14" y="-54" width="28" height="60" rx="13" fill="#CFD6E4" stroke="#1D3557" stroke-width="5"/>
      <ellipse cx="0" cy="-54" rx="14" ry="9.5" fill="#55607A" stroke="#1D3557" stroke-width="4.5"/>
      <circle cx="0" cy="-54" r="5.5" fill="#161F33"/>
    </g>
    <g transform="translate(145 95) rotate(25)">
      <rect x="-14" y="-54" width="28" height="60" rx="13" fill="#CFD6E4" stroke="#1D3557" stroke-width="5"/>
      <ellipse cx="0" cy="-54" rx="14" ry="9.5" fill="#55607A" stroke="#1D3557" stroke-width="4.5"/>
      <circle cx="0" cy="-54" r="5.5" fill="#161F33"/>
    </g>
    <!-- squirt from right cannon -->
    <use href="#drop" transform="translate(172 26) scale(0.55) rotate(30)"/>
    <use href="#drop" transform="translate(184 8) scale(0.75) rotate(15)"/>
    <use href="#drop" transform="translate(194 32) scale(0.5) rotate(55)"/>
    <!-- shell + body -->
    <ellipse cx="100" cy="140" rx="78" ry="62" fill="#9C6B43" stroke="#1D3557" stroke-width="5.5"/>
    <ellipse cx="62" cy="202" rx="20" ry="12" fill="#5BA8E5" stroke="#1D3557" stroke-width="5"/>
    <ellipse cx="138" cy="202" rx="20" ry="12" fill="#5BA8E5" stroke="#1D3557" stroke-width="5"/>
    <ellipse cx="100" cy="142" rx="64" ry="54" fill="#5BA8E5" stroke="#1D3557" stroke-width="5.5"/>
    <ellipse cx="35" cy="152" rx="15" ry="25" fill="#5BA8E5" stroke="#1D3557" stroke-width="5" transform="rotate(18 35 152)"/>
    <ellipse cx="165" cy="152" rx="15" ry="25" fill="#5BA8E5" stroke="#1D3557" stroke-width="5" transform="rotate(-18 165 152)"/>
    <ellipse cx="100" cy="156" rx="40" ry="36" fill="#F7E7C3" stroke="#1D3557" stroke-width="5"/>
    <!-- head -->
    <circle cx="62" cy="28" r="9" fill="#5BA8E5" stroke="#1D3557" stroke-width="4.5"/>
    <circle cx="138" cy="28" r="9" fill="#5BA8E5" stroke="#1D3557" stroke-width="4.5"/>
    <circle cx="100" cy="62" r="46" fill="#5BA8E5" stroke="#1D3557" stroke-width="5.5"/>
    <!-- face -->
    <ellipse cx="82" cy="56" rx="11" ry="13" fill="#FFFFFF" stroke="#1D3557" stroke-width="3.5"/>
    <ellipse cx="120" cy="56" rx="11" ry="13" fill="#FFFFFF" stroke="#1D3557" stroke-width="3.5"/>
    <circle cx="84" cy="58" r="5" fill="#1D3557"/>
    <circle cx="118" cy="58" r="5" fill="#1D3557"/>
    <circle cx="86" cy="55.5" r="1.8" fill="#FFFFFF"/>
    <circle cx="116" cy="55.5" r="1.8" fill="#FFFFFF"/>
    <path d="M 66 37 L 93 44" stroke="#1D3557" stroke-width="6" fill="none"/>
    <path d="M 134 37 L 107 44" stroke="#1D3557" stroke-width="6" fill="none"/>
    <path d="M 78 79 Q 100 96 122 79" stroke="#1D3557" stroke-width="5.5" fill="none"/>
    <circle cx="96" cy="70" r="1.8" fill="#1D3557"/>
    <circle cx="106" cy="70" r="1.8" fill="#1D3557"/>
  </g>

  <!-- ================= panel 1 : controls ================= -->
  <rect x="25" y="282" width="600" height="350" rx="20" fill="url(#panelfade)" stroke="#1D3557" stroke-width="5"/>
  <rect x="180" y="259" width="290" height="46" rx="23" fill="#EE3E34" stroke="#1D3557" stroke-width="5"/>
  <text class="h outline" x="325" y="293" font-size="27" text-anchor="middle"
        fill="#FFFFFF" stroke="#1D3557" stroke-width="5">YOUR CONTROLS</text>

  <!-- mini faceplate -->
  <g transform="translate(48 331)">
    <rect x="0" y="0" width="290" height="250" rx="18" fill="#DCEFFF" stroke="#1D3557" stroke-width="4"/>
    <!-- oled -->
    <rect x="45" y="30" width="200" height="115" rx="8" fill="#101B33" stroke="#1D3557" stroke-width="4"/>
    <text class="mono" x="55" y="52" font-size="13">SURF</text>
    <text class="mono" x="235" y="52" font-size="13" text-anchor="end">ICE BEAM</text>
    <text class="mono" x="55" y="136" font-size="13">BITE</text>
    <text class="mono" x="235" y="136" font-size="13" text-anchor="end">SKULL BASH</text>
    <!-- tiny sprite on screen -->
    <g stroke="#86E7FF" stroke-width="3" fill="none" stroke-linecap="round">
      <ellipse cx="140" cy="95" rx="22" ry="15"/>
      <circle cx="160" cy="78" r="9"/>
      <path d="M 156 80 Q 160 84 164 80"/>
      <path d="M 133 83 L 124 72"/>
    </g>
    <circle cx="123" cy="71" r="2.5" fill="#86E7FF" stroke="none"/>
    <circle cx="158" cy="76" r="1.6" fill="#86E7FF" stroke="none"/>
    <!-- corner buttons + connectors -->
    <use href="#redbtn" transform="translate(22 25)"/>
    <use href="#redbtn" transform="translate(268 25)"/>
    <use href="#redbtn" transform="translate(22 150)"/>
    <use href="#redbtn" transform="translate(268 150)"/>
    <g stroke="#1D3557" stroke-width="2.5" stroke-dasharray="4 4" opacity="0.65">
      <line x1="33" y1="33" x2="52" y2="44"/>
      <line x1="257" y1="33" x2="238" y2="44"/>
      <line x1="33" y1="142" x2="52" y2="131"/>
      <line x1="257" y1="142" x2="238" y2="131"/>
    </g>
    <!-- party row -->
    <use href="#pokeball" transform="translate(95 200) scale(0.75)"/>
    <use href="#pokeball" transform="translate(145 200) scale(0.75)"/>
    <use href="#pokeball" transform="translate(195 200) scale(0.75)"/>
    <text class="bb" x="145" y="240" font-size="15" text-anchor="middle" fill="#1D3557">PARTY ROW</text>
  </g>

  <!-- controls captions -->
  <text class="bb" x="368" y="374" font-size="22" fill="#1D3557">CORNER BUTTON</text>
  <text class="bb" x="368" y="401" font-size="22" fill="#1D3557">= CORNER MOVE!</text>
  <text class="bb" x="368" y="447" font-size="20" fill="#EE3E34">TAP</text>
  <text class="b" x="418" y="447" font-size="20" fill="#1D3557">= choose it</text>
  <text class="bb" x="368" y="476" font-size="20" fill="#EE3E34">HOLD</text>
  <text class="b" x="432" y="476" font-size="20" fill="#1D3557">= inspect it</text>
  <text class="b" x="368" y="521" font-size="19" fill="#1D3557">The 3 party buttons</text>
  <text class="b" x="368" y="545" font-size="19" fill="#1D3557">switch your Pok&#233;mon.</text>
  <use href="#drop" transform="translate(390 588) scale(0.8)"/>
  <use href="#spark" transform="translate(440 590) scale(0.7)"/>

  <!-- ================= panel 2 : how to play ================= -->
  <rect x="25" y="664" width="600" height="396" rx="20" fill="url(#panelfade)" stroke="#1D3557" stroke-width="5"/>
  <rect x="200" y="641" width="250" height="46" rx="23" fill="#4E9FE0" stroke="#1D3557" stroke-width="5"/>
  <text class="h outline" x="325" y="675" font-size="27" text-anchor="middle"
        fill="#FFFFFF" stroke="#1D3557" stroke-width="5">HOW TO PLAY</text>

  <g>
    <g class="stepnum" font-size="16" text-anchor="middle">
      <circle cx="60" cy="712" r="12" fill="#EE3E34" stroke="#1D3557" stroke-width="3.5"/>
      <text class="bb" x="60" y="718" font-size="16" fill="#FFFFFF">1</text>
      <circle cx="60" cy="744" r="12" fill="#EE3E34" stroke="#1D3557" stroke-width="3.5"/>
      <text class="bb" x="60" y="750" font-size="16" fill="#FFFFFF">2</text>
      <circle cx="60" cy="776" r="12" fill="#EE3E34" stroke="#1D3557" stroke-width="3.5"/>
      <text class="bb" x="60" y="782" font-size="16" fill="#FFFFFF">3</text>
      <circle cx="60" cy="832" r="12" fill="#EE3E34" stroke="#1D3557" stroke-width="3.5"/>
      <text class="bb" x="60" y="838" font-size="16" fill="#FFFFFF">4</text>
      <circle cx="60" cy="888" r="12" fill="#EE3E34" stroke="#1D3557" stroke-width="3.5"/>
      <text class="bb" x="60" y="894" font-size="16" fill="#FFFFFF">5</text>
      <circle cx="60" cy="944" r="12" fill="#EE3E34" stroke="#1D3557" stroke-width="3.5"/>
      <text class="bb" x="60" y="950" font-size="16" fill="#FFFFFF">6</text>
      <circle cx="60" cy="1000" r="12" fill="#EE3E34" stroke="#1D3557" stroke-width="3.5"/>
      <text class="bb" x="60" y="1006" font-size="16" fill="#FFFFFF">7</text>
    </g>
    <g class="b" font-size="19" fill="#1D3557">
      <text x="86" y="718">Tap any button to ready up (tap again to bail).</text>
      <text x="86" y="750">Both trainers ready? 3... 2... 1... GO!</text>
      <text x="86" y="782">No rival? HOLD any button in the lobby and a</text>
      <text x="86" y="806">robot rival plays the other side.</text>
      <text x="86" y="838">Every battle deals each trainer 3 random</text>
      <text x="86" y="862">Pok&#233;mon. New round, new team!</text>
      <text x="86" y="894">Each turn, tap a corner button to use that</text>
      <text x="86" y="918">corner's move, or tap a party button to switch.</text>
      <text x="86" y="950">Fainted? Your party buttons pick the next</text>
      <text x="86" y="974">fighter. No move buttons until you do!</text>
      <text x="86" y="1006">Locked in too fast? You have 1 second after</text>
      <text x="86" y="1030">both sides commit to tap again and rethink.</text>
    </g>
  </g>

  <!-- ================= panel 3 : arena rules ================= -->
  <rect x="25" y="1096" width="600" height="276" rx="20" fill="url(#panelfade)" stroke="#1D3557" stroke-width="5"/>
  <rect x="200" y="1073" width="250" height="46" rx="23" fill="#2EC4B6" stroke="#1D3557" stroke-width="5"/>
  <text class="h outline" x="325" y="1107" font-size="27" text-anchor="middle"
        fill="#FFFFFF" stroke="#1D3557" stroke-width="5">ARENA RULES</text>

  <use href="#drop" transform="translate(60 1142) scale(0.7)"/>
  <use href="#drop" transform="translate(60 1198) scale(0.7)"/>
  <use href="#drop" transform="translate(60 1254) scale(0.7)"/>
  <use href="#drop" transform="translate(60 1310) scale(0.7)"/>
  <use href="#drop" transform="translate(60 1342) scale(0.7)"/>
  <g class="b" font-size="19" fill="#1D3557">
    <text x="86" y="1146">Faster Pok&#233;mon strike first. Speedy sprites</text>
    <text x="86" y="1170">literally bounce faster on screen.</text>
    <text x="86" y="1202">True Gen 1 rules: type matchups, wild crits,</text>
    <text x="86" y="1226">PSN, BRN, PAR, SLP, FRZ. Only Fire thaws a freeze.</text>
    <text x="86" y="1258">Hyper Beam is mighty, but you must press</text>
    <text x="86" y="1282">RECHARGE and sit out the next turn.</text>
    <text x="86" y="1314">Your LED is your HP: green, then yellow, then red.</text>
    <text x="86" y="1346" font-weight="800">Last Pok&#233;mon standing wins the match!</text>
  </g>

  <!-- ================= footer ================= -->
  <use href="#pokeball" transform="translate(52 1404) scale(0.6)"/>
  <use href="#pokeball" transform="translate(598 1404) scale(0.6)"/>
  <text class="bb" x="325" y="1402" font-size="15.5" text-anchor="middle" fill="#1D3557">Bored? Leave it alone for 15 seconds and it battles itself.</text>
  <g class="b" font-size="11.5" text-anchor="middle" opacity="0.75" fill="#1D3557">
    <text x="325" y="1423">A fan-made hobby build, lovingly soldered by hand.</text>
    <text x="325" y="1438">Not affiliated with Nintendo, Creatures, GAME FREAK or The Pok&#233;mon Company.</text>
  </g>
</svg>
