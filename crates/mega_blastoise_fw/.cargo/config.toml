# Linker args are chip-independent; the memory map underneath them is chosen
# by build.rs from the rp2040/rp2350 cargo feature.
[target.'cfg(all(target_arch = "arm", target_os = "none"))']
rustflags = [
  "-C", "link-arg=-Tlink.x",
  "-C", "link-arg=-Tdefmt.x",
  "-C", "link-arg=--nmagic",
]

# Runner is per-triple because the triple IS the chip here, and probe-rs needs
# to be told which one it is talking to.
[target.thumbv6m-none-eabi]
runner = "probe-rs run --preset pico --log-format=oneline"

[target.'thumbv8m.main-none-eabihf']
runner = "probe-rs run --preset pico2 --log-format=oneline"

[env]
DEFMT_LOG = "info"

[build]
target = "thumbv6m-none-eabi"

[alias]
rb = "run --bin"
rrb = "run --release --bin"
# RP2350 (Pico 2). The chip is a default feature, so it can only be swapped by
# replacing the whole default set — these aliases carry the boilerplate.
b2350 = "build --target thumbv8m.main-none-eabihf --no-default-features --features rp2350,usb,oled,buzzer,leds"
r2350 = "run --target thumbv8m.main-none-eabihf --no-default-features --features rp2350,usb,oled,buzzer,leds"
# Stripboard v2 (Pico 2 + ST7796 + 16 direct buttons). No usb yet: the
# board_v2 milestone drives DeviceSession from the physical buttons only.
bv2 = "build --target thumbv8m.main-none-eabihf --no-default-features --features rp2350,board_v2,input-debug"
rv2 = "run --target thumbv8m.main-none-eabihf --no-default-features --features rp2350,board_v2,input-debug"
