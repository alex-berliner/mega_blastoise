[package]
name = "mega-blastoise-core"
version = "0.1.0"
edition = "2021"

[dependencies]
battle_types = { path = "../battle_types" }
embedded-graphics = { version = "0.8", default-features = false }
battler = { path = "../../battler/battler", default-features = false, features = [] }
battler-data = { path = "../../battler/battler-data", default-features = false }
gen1_battle = { path = "../gen1_battle" }
gen3_battle = { path = "../gen3_battle" }
# The Showdown split (docs/architecture/showdown-split-plan.md): the PS
# server, its client and their protocol, behind `runner::ps`.
ps_client = { path = "../ps_client" }
ps_dex = { path = "../ps_dex" }
ps_protocol = { path = "../ps_protocol" }
ps_sim = { path = "../ps_sim" }
serde = { version = "1.0", default-features = false, features = ["derive"] }
anyhow = { version = "1.0", default-features = false }
ciborium = { version = "0.2", default-features = false }
embassy-sync = { version = "0.7", default-features = false }
embassy-futures = "0.1"
defmt = { version = "1.0", optional = true }
embassy-time = { version = "0.5", optional = true }

[features]
default = []
# Display variants (combine freely):
#  - bigsprite: un-rescaled 56px Game Boy sprites
#  - wrapmoves: corner move names wrapped/hyphenated across lines
bigsprite = []
wrapmoves = []
defmt = ["dep:defmt"]
timing = ["dep:embassy-time", "defmt"]
trace = ["defmt"]
# The PS engine (`runner::Engine::Ps`) is the device's default engine
# instead of the legacy ones. It is always compiled in; this only flips the
# default `DevicePort::engine` answers with.
ps_engine = []
# `transport::TextTransport`: the PS line protocol over a byte stream. Off on
# the device (the typed `LocalTransport` needs no text).
ps_text = ["ps_protocol/text", "ps_sim/text"]

[dev-dependencies]
# The transport tests run the same battles over the typed and the text path.
ps_protocol = { path = "../ps_protocol", features = ["text"] }
ps_sim = { path = "../ps_sim", features = ["text"] }
# The text transport's test server parses `>start` / `>player` JSON.
serde_json = "1.0"
# `LocalTransport`'s spill buffer is a critical-section mutex; the host tests
# need an implementation (the firmware's is embassy-rp's, the web's std's).
critical-section = { version = "1", features = ["std"] }

[build-dependencies]
serde_json = "1.0"
ciborium = "0.2"
ureq = "2"
png = "0.17"
qrcode = { version = "0.14", default-features = false }
