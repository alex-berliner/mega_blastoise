[package]
name = "mega-blastoise-test"
version = "0.1.0"
edition = "2021"
default-run = "mega-blastoise-test"

[dependencies]
embedded-graphics = "0.8"
mega-blastoise-core = { path = "../mega_blastoise_core" }
ps_dex = { path = "../ps_dex" }
# `LocalTransport`'s spill buffer is a critical-section mutex; the host needs
# an implementation (the firmware's is embassy-rp's, the web's std's).
critical-section = { version = "1", features = ["std"] }
serde_json = "1.0"
pollster = "0.3"
embassy-futures = "0.1"
