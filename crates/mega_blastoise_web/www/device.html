<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>Mega Blastoise — single screen</title>
<link rel="stylesheet" href="device.css">
</head>
<body>

<!-- The physical device: one portrait panel in the middle and a control
     deck at each end, with the reference design's DS Lite parts: D-pad on
     the seat's left, X/A/B/Y diamond on its right, and Select and Start side
     by side between them, toward the seat's end of the case. Player 2 sits at the top edge, so their deck is player 1's rotated
     180 and reads upright from their seat. This layout is FIXED: screen
     content rotates, the controls never do. -->
<div id="device">

  <div class="deck far" data-player="2">
    <div class="dpad" data-player="2">
      <button class="d up"    data-dir="0" aria-label="player 2 up"></button>
      <button class="d left"  data-dir="2" aria-label="player 2 left"></button>
      <button class="d right" data-dir="3" aria-label="player 2 right"></button>
      <button class="d down"  data-dir="1" aria-label="player 2 down"></button>
      <span class="pivot" aria-hidden="true"></span>
    </div>
    <div class="ss">
      <div class="ssb select">
        <span class="sl">SELECT</span>
        <button class="pill" data-player="2" data-btn="select" aria-label="player 2 select"
          title="Select: not wired yet (core has no Select button)"></button>
      </div>
      <div class="ssb start">
        <span class="sl">START</span>
        <button class="pill" data-player="2" data-btn="start" aria-label="player 2 start"
          title="Start: not wired yet (core has no Start button)"></button>
      </div>
    </div>
    <div class="face">
      <div class="abxy">
        <span class="qmark" aria-hidden="true">?</span>
        <button class="cap x" data-player="2" data-btn="x" title="X: the ? (info) key">X</button>
        <button class="cap y" data-player="2" data-btn="y" title="Y: the menu key">Y</button>
        <button class="cap a" data-player="2" data-btn="a">A</button>
        <button class="cap b" data-player="2" data-btn="b">B</button>
      </div>
    </div>
  </div>

  <canvas id="panel" width="320" height="480"></canvas>

  <div class="deck near" data-player="1">
    <div class="dpad" data-player="1">
      <button class="d up"    data-dir="0" aria-label="player 1 up"></button>
      <button class="d left"  data-dir="2" aria-label="player 1 left"></button>
      <button class="d right" data-dir="3" aria-label="player 1 right"></button>
      <button class="d down"  data-dir="1" aria-label="player 1 down"></button>
      <span class="pivot" aria-hidden="true"></span>
    </div>
    <div class="ss">
      <div class="ssb select">
        <span class="sl">SELECT</span>
        <button class="pill" data-player="1" data-btn="select" aria-label="player 1 select"
          title="Select: not wired yet (core has no Select button)"></button>
      </div>
      <div class="ssb start">
        <span class="sl">START</span>
        <button class="pill" data-player="1" data-btn="start" aria-label="player 1 start"
          title="Start: not wired yet (core has no Start button)"></button>
      </div>
    </div>
    <div class="face">
      <div class="abxy">
        <span class="qmark" aria-hidden="true">?</span>
        <button class="cap x" data-player="1" data-btn="x" title="X: the ? (info) key">X</button>
        <button class="cap y" data-player="1" data-btn="y" title="Y: the menu key">Y</button>
        <button class="cap a" data-player="1" data-btn="a">A</button>
        <button class="cap b" data-player="1" data-btn="b">B</button>
      </div>
    </div>
  </div>

</div>

<div id="debug">
  <button id="turn-btn" title="Walk around the table: turns the console on the page without changing a pixel it draws">rotate view &#8635;</button>
  <span class="sep"></span>
  <span class="lbl">SCREEN</span>
  <select id="size-sel" title="Show the device at the true physical size of a candidate panel"></select>
  <span class="sep"></span>
  <button id="ai-btn">vs AI</button>
  <button id="demo-btn">demo</button>
  <button id="reset-btn">reset</button>
  <span class="sep"></span>
  <button id="console-btn" title="Show captured console output (backtick toggles)">console</button>
  <span class="sep"></span>
  <span class="hint">P1: WASD, Z X C V = A B X Y, E start, Q select &nbsp;·&nbsp; P2: arrows, , . / M = A B X Y, Enter start, R-Shift select</span>
</div>

<script type="module" src="device.js"></script>
</body>
</html>
