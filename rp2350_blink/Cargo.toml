# Standalone: the parent workspace is RP2040 (thumbv6m) and pins embassy-rp to
# the rp2040 feature, which is mutually exclusive with rp235xa.
[workspace]

[package]
name = "rp2350-blink"
version = "0.1.0"
edition = "2021"

[dependencies]
cortex-m-rt = "0.7"
embassy-executor = { version = "0.9", features = ["arch-cortex-m", "executor-thread"] }
embassy-rp = { version = "0.8", features = ["rp235xa", "critical-section-impl", "time-driver"] }
embassy-time = "0.5"
embassy-usb = "0.6"
static_cell = "2"
panic-halt = "1"

[profile.release]
opt-level = "s"
lto = true
debug = 2
