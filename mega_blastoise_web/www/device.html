<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>Mega Blastoise — single screen</title>
<link rel="stylesheet" href="device.css">
</head>
<body>
<div id="stage">
  <div class="seat seat-far" id="seat2">
    <div class="pad">
      <div class="dpad" data-player="2">
        <button class="d up"    data-dir="0" aria-label="up"></button>
        <button class="d left"  data-dir="2" aria-label="left"></button>
        <button class="d right" data-dir="3" aria-label="right"></button>
        <button class="d down"  data-dir="1" aria-label="down"></button>
      </div>
      <div class="abq">
        <button class="rb q" data-player="2" data-btn="q">?</button>
        <button class="rb b" data-player="2" data-btn="b">B</button>
        <button class="rb a" data-player="2" data-btn="a">A</button>
      </div>
    </div>
  </div>

  <canvas id="panel" width="240" height="320"></canvas>

  <div class="seat seat-near" id="seat1">
    <div class="pad">
      <div class="dpad" data-player="1">
        <button class="d up"    data-dir="0" aria-label="up"></button>
        <button class="d left"  data-dir="2" aria-label="left"></button>
        <button class="d right" data-dir="3" aria-label="right"></button>
        <button class="d down"  data-dir="1" aria-label="down"></button>
      </div>
      <div class="abq">
        <button class="rb q" data-player="1" data-btn="q">?</button>
        <button class="rb b" data-player="1" data-btn="b">B</button>
        <button class="rb a" data-player="1" data-btn="a">A</button>
      </div>
    </div>
  </div>
</div>

<div id="debug">
  <span class="lbl">ORIENTATION</span>
  <button id="auto-btn" class="on">auto</button>
  <button data-orient="0">head-to-head</button>
  <button data-orient="1">same-way</button>
  <button data-orient="2">landscape</button>
  <span class="sep"></span>
  <button id="ai-btn">vs AI</button>
  <button id="demo-btn">demo</button>
  <button id="reset-btn">reset</button>
  <span class="sep"></span>
  <a href="index.html" style="color:#8a8f98;font-size:11px">&larr; old two-OLED UI</a>
  <span class="hint">P1: WASD + Z X C &nbsp;·&nbsp; P2: arrows + , . /</span>
</div>

<script type="module" src="device.js"></script>
</body>
</html>
