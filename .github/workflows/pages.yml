name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown

      - name: Cache cargo registry
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
          key: wasm-${{ hashFiles('crates/mega_blastoise_web/Cargo.lock') }}
          restore-keys: wasm-

      - name: Install wasm-pack
        run: curl https://rustwasm.github.io/wasm-pack/installer/init.sh -sSf | sh

      - name: Build WASM
        working-directory: crates/mega_blastoise_web
        run: wasm-pack build --target web --release

      - name: Assemble site
        run: |
          # The site's root is a hub (site/) that links to everything below it.
          mkdir -p _site
          cp -r site/. _site/
          # The battler lives under /battler/ (its pages link to each other relatively).
          # EVERYTHING in www/ ships. Naming the files one at a time is how the
          # in-page console stayed missing for two days: the file was written,
          # committed, and present on every branch, and this list simply did
          # not mention it, so the deploy 404'd a file that existed everywhere
          # we looked. A whole-directory copy cannot forget a new one.
          mkdir -p _site/battler
          cp -r crates/mega_blastoise_web/www/. _site/battler/
          # www/pkg is checked in but stale by definition; the fresh build wins.
          rm -rf _site/battler/pkg
          mkdir -p _site/battler/pkg
          cp crates/mega_blastoise_web/pkg/*.js       _site/battler/pkg/
          cp crates/mega_blastoise_web/pkg/*.wasm     _site/battler/pkg/
          # The battler's pages used to sit at the root: old links forward, query string and all
          for page in device.html ui_flow.html; do
            printf '<!doctype html><meta charset="utf-8"><title>Moved</title><script>location.replace("battler/%s" + location.search + location.hash)</script><a href="battler/%s">Moved to /battler/%s</a>\n' "$page" "$page" "$page" > "_site/$page"
          done
          # The reference design's exploded 3D view, built locally (it needs KiCad's 3D
          # library and OpenSCAD) and kept fresh by its pre-push hook.
          mkdir -p _site/assembly
          cp -r hardware/ref_design/viewer/site/. _site/assembly/
          python3 hardware/ref_design/viewer/build.py --check || echo "::warning::the assembly viewer is older than the board or case it shows; run hardware/ref_design/viewer/build.py"
          # The earlier layout's view (the cell on the board under the screen), from branch
          # ref-design-cell-on-board. Deploys only run from main, so a push to that branch
          # shows up at the next main deploy (or a manual run of this workflow).
          if git fetch --depth=1 origin ref-design-cell-on-board; then
            mkdir -p _site/assembly-cell-on-board
            git archive FETCH_HEAD hardware/ref_design/viewer/site | tar -x -C "$RUNNER_TEMP"
            cp -r "$RUNNER_TEMP"/hardware/ref_design/viewer/site/. _site/assembly-cell-on-board/
          else
            echo "::warning::no ref-design-cell-on-board branch: its assembly view is not published"
          fi
          # The current shell (the cell in the board), from branch ref-design-cellcut, until it
          # reaches main: published the same way, at /assembly-cellcut/
          if git fetch --depth=1 origin ref-design-cellcut; then
            mkdir -p _site/assembly-cellcut "$RUNNER_TEMP/cellcut"
            git archive FETCH_HEAD hardware/ref_design/viewer/site | tar -x -C "$RUNNER_TEMP/cellcut"
            cp -r "$RUNNER_TEMP"/cellcut/hardware/ref_design/viewer/site/. _site/assembly-cellcut/
          else
            echo "::warning::no ref-design-cellcut branch: its assembly view is not published"
          fi
          # Every distinct layout's last assembly view, listed in site/views/views.json (one
          # line each), at /views/<slug>/. Each commit is fetched by SHA (or its viewer/* tag,
          # for commits on no pushed branch); one that can't be fetched only warns.
          python3 scripts/site_views.py _site || echo "::warning::scripts/site_views.py failed: the exploded views are not all published"
          # the battery-under-board variant became the reference: its old address forwards
          mkdir -p _site/assembly-battery-bottom
          printf '<!doctype html><meta charset="utf-8"><meta http-equiv="refresh" content="0; url=../assembly/"><a href="../assembly/">Moved to /assembly/</a>\n' > _site/assembly-battery-bottom/index.html
          # Without this, Jekyll drops anything starting with an underscore.
          touch _site/.nojekyll
          ls -la _site

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
