name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown

      - name: Cache cargo registry
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
          key: wasm-${{ hashFiles('mega_blastoise_web/Cargo.lock') }}
          restore-keys: wasm-

      - name: Install wasm-pack
        run: curl https://rustwasm.github.io/wasm-pack/installer/init.sh -sSf | sh

      - name: Build WASM
        working-directory: mega_blastoise_web
        run: wasm-pack build --target web --release

      - name: Assemble site
        run: |
          # EVERYTHING in www/ ships. Naming the files one at a time is how the
          # in-page console stayed missing for two days: the file was written,
          # committed, and present on every branch, and this list simply did
          # not mention it, so the deploy 404'd a file that existed everywhere
          # we looked. A whole-directory copy cannot forget a new one.
          mkdir -p _site
          cp -r mega_blastoise_web/www/. _site/
          # www/pkg is checked in but stale by definition; the fresh build wins.
          rm -rf _site/pkg
          mkdir -p _site/pkg
          cp mega_blastoise_web/pkg/*.js       _site/pkg/
          cp mega_blastoise_web/pkg/*.wasm     _site/pkg/
          # Without this, Jekyll drops anything starting with an underscore.
          touch _site/.nojekyll
          ls -la _site

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
